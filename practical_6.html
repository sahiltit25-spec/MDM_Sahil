<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT25103_SAHIL-TIGHARE</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="calculator-card w-full max-w-lg bg-amber-100 p-8 rounded-xl shadow-lg">

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
            Result (Grade) Calculator
        </h2>

        <!-- Subject 1 -->
        <div class="mb-5">
            <label for="p1" class="block font-semibold text-gray-700 mb-2">
                Subject 1 (out of 100)
            </label>

            <input
                type="number"
                id="p1"
                min="0"
                max="100"
                placeholder="Enter marks"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Subject 2 -->
        <div class="mb-5">
            <label for="p2" class="block font-semibold text-gray-700 mb-2">
                Subject 2 (out of 100)
            </label>

            <input
                type="number"
                id="p2"
                min="0"
                max="100"
                placeholder="Enter marks"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Subject 3 -->
        <div class="mb-5">
            <label for="p3" class="block font-semibold text-gray-700 mb-2">
                Subject 3 (out of 100)
            </label>

            <input
                type="number"
                id="p3"
                min="0"
                max="100"
                placeholder="Enter marks"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Subject 4 -->
        <div class="mb-5">
            <label for="p4" class="block font-semibold text-gray-700 mb-2">
                Subject 4 (out of 100)
            </label>

            <input
                type="number"
                id="p4"
                min="0"
                max="100"
                placeholder="Enter marks"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Subject 5 -->
        <div class="mb-6">
            <label for="p5" class="block font-semibold text-gray-700 mb-2">
                Subject 5 (out of 100)
            </label>

            <input
                type="number"
                id="p5"
                min="0"
                max="100"
                placeholder="Enter marks"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Button -->
        <button
            onclick="calculateResults()"
            class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg
                   hover:bg-blue-700 transition duration-200">
            Calculate Result
        </button>

        <!-- Results -->
        <div
            id="outputBox"
            class="hidden mt-6 p-5 bg-gray-50 border border-gray-200 rounded-lg">

            <p class="text-lg text-gray-700 mb-3">
                <strong>Total Marks:</strong>
                <span id="total" class="font-semibold"></span> / 500
            </p>

            <p class="text-lg text-gray-700 mb-3">
                <strong>Percentage:</strong>
                <span id="percentage" class="font-semibold"></span>%
            </p>

            <p class="text-lg text-gray-700">
                <strong>Grade:</strong>
                <span id="grade" class="font-bold text-blue-600"></span>
            </p>

        </div>

    </div>


    <script>

        function calculateResults() {

            // Get marks
            const p1 = parseFloat(document.getElementById("p1").value || 0);
            const p2 = parseFloat(document.getElementById("p2").value || 0);
            const p3 = parseFloat(document.getElementById("p3").value || 0);
            const p4 = parseFloat(document.getElementById("p4").value || 0);
            const p5 = parseFloat(document.getElementById("p5").value || 0);

            // Total marks
            const maxMarks = 500;

            const total = p1 + p2 + p3 + p4 + p5;

            // Percentage
            const percentage = (total / maxMarks) * 100;

            // Grade
            let grade = "";

            if (percentage >= 90) {
                grade = "A+ (Excellent)";
            }
            else if (percentage >= 80) {
                grade = "A (Very Good)";
            }
            else if (percentage >= 70) {
                grade = "B (Good)";
            }
            else if (percentage >= 60) {
                grade = "C (Satisfactory)";
            }
            else {
                grade = "F (Fail)";
            }

            // Display result
            document.getElementById("total").textContent =
                total.toFixed(1);

            document.getElementById("percentage").textContent =
                percentage.toFixed(2);

            document.getElementById("grade").textContent =
                grade;

            document.getElementById("outputBox").classList.remove("hidden");
        }

    </script>

</body>

</html>
