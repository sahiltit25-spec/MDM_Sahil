<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT25103_Sahil Tighare</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-lg p-8 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">
            Student Registration
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Enter your details to register
        </p>

        <form id="registrationForm">

            <!-- Name -->
            <div class="mb-4">
                <label class="block font-semibold mb-1">
                    Full Name
                </label>

                <input type="text" id="name"
                    placeholder="Enter your full name"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p id="nameError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block font-semibold mb-1">
                    Email
                </label>

                <input type="text" id="email"
                    placeholder="example@gmail.com"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p id="emailError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block font-semibold mb-1">
                    Password
                </label>

                <input type="password" id="password"
                    placeholder="Minimum 6 characters"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Mobile -->
            <div class="mb-4">
                <label class="block font-semibold mb-1">
                    Mobile Number
                </label>

                <input type="text" id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p id="mobileError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Course -->
            <div class="mb-6">
                <label class="block font-semibold mb-1">
                    Select Course
                </label>

                <select id="course"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="">Select Course</option>
                    <option value="IT">Information Technology</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ENTC">ENTC</option>
                    <option value="Mechanical">Mechanical</option>

                </select>

                <p id="courseError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Register
            </button>

            <!-- Success Message -->
            <p id="successMessage"
                class="text-green-600 text-center font-semibold mt-4">
            </p>

        </form>
    </div>

    <script>

        document.getElementById("registrationForm").addEventListener("submit",
            function(event) {

                event.preventDefault();

                // Get values
                let name = document.getElementById("name").value.trim();
                let email = document.getElementById("email").value.trim();
                let password = document.getElementById("password").value;
                let mobile = document.getElementById("mobile").value.trim();
                let course = document.getElementById("course").value;

                // Error elements
                let nameError = document.getElementById("nameError");
                let emailError = document.getElementById("emailError");
                let passwordError = document.getElementById("passwordError");
                let mobileError = document.getElementById("mobileError");
                let courseError = document.getElementById("courseError");
                let successMessage = document.getElementById("successMessage");

                // Clear old messages
                nameError.textContent = "";
                emailError.textContent = "";
                passwordError.textContent = "";
                mobileError.textContent = "";
                courseError.textContent = "";
                successMessage.textContent = "";

                let valid = true;

                // Name validation
                if (name === "") {
                    nameError.textContent = "Name is required.";
                    valid = false;
                }

                // Email validation
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email === "") {
                    emailError.textContent = "Email is required.";
                    valid = false;
                }
                else if (!emailPattern.test(email)) {
                    emailError.textContent = "Enter a valid email address.";
                    valid = false;
                }

                // Password validation
                if (password === "") {
                    passwordError.textContent = "Password is required.";
                    valid = false;
                }
                else if (password.length < 6) {
                    passwordError.textContent =
                        "Password must be at least 6 characters.";
                    valid = false;
                }

                // Mobile validation
                let mobilePattern = /^[0-9]{10}$/;

                if (mobile === "") {
                    mobileError.textContent = "Mobile number is required.";
                    valid = false;
                }
                else if (!mobilePattern.test(mobile)) {
                    mobileError.textContent =
                        "Mobile number must contain exactly 10 digits.";
                    valid = false;
                }

                // Course validation
                if (course === "") {
                    courseError.textContent = "Please select a course.";
                    valid = false;
                }

                // Final result
                if (valid) {
                    successMessage.textContent =
                        "Registration successful!";

                    document.getElementById("registrationForm").reset();
                }
            });

    </script>

</body>
</html>
